services:
  substacker:
    build:
      context: .
      dockerfile: Dockerfile
    image: substacker-native:latest
    container_name: substacker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      QUARKUS_HTTP_HOST: "0.0.0.0"
      SUBSTACKER_DATA_DIR: "/work/data"
    volumes:
      - substacker-data:/work/data
    networks:
      default:
        ipv4_address: 192.168.3.5
        # 👇 就加这一行，固定 MAC 地址
        mac_address: "02:42:C0:A8:03:05"

volumes:
  substacker-data:

networks:
  default:
    external: true
    name: ${SUBSTACKER_DOCKER_NETWORK:-macvlan_net}
