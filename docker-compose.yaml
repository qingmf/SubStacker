services:
  substacker:
    build:
      context: .
      dockerfile: Dockerfile
    image: substacker-native:latest
    container_name: substacker
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      QUARKUS_HTTP_HOST: "0.0.0.0"
      SUBSTACKER_DATA_DIR: "/work/data"
    volumes:
      - substacker-data:/work/data
    networks:
      - default

volumes:
  substacker-data:

networks:
  default:
    external: true
    name: ${SUBSTACKER_DOCKER_NETWORK:-macvlan_net}
