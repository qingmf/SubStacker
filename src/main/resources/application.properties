quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=*
quarkus.package.jar.type=uber-jar
quarkus.package.jar.add-runner-suffix=false

# Where config is stored (defaults to ./data)
substacker.data-dir=./data

# HTTP fetch timeouts (ISO-8601 duration format)
substacker.http-connect-timeout=PT5S
substacker.http-request-timeout=PT5S
